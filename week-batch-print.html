<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch tickets — week</title>
    <link rel="icon" href="data:,">
    <style>
        /* screen chrome only; the ticket pages carry the portal's print stylesheet (added by the script) */
        body { margin: 0; background: #e5e7eb; font-family: 'Segoe UI', Arial, sans-serif; color: #111; }
        .wb-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: #111827; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
        .wb-bar h1 { font-size: 16px; margin: 0; font-weight: 700; }
        .wb-bar a { color: #93c5fd; text-decoration: none; font-size: 13px; }
        .wb-bar a:hover { text-decoration: underline; }
        .wb-bar .wb-summary { font-size: 13px; color: #d1d5db; margin-left: auto; }
        .wb-bar button { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .wb-bar button:disabled { background: #6b7280; cursor: not-allowed; }
        .wb-status { padding: 8px 16px; font-size: 13px; color: #374151; background: #f3f4f6; border-bottom: 1px solid #d1d5db; min-height: 18px; }
        .wb-warn { color: #b45309; font-weight: 700; }
        #wb-doc { padding: 16px; }
        #wb-doc .bt-page { background: #fff; margin: 0 auto 16px; max-width: 7.7in; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
        .wb-hidden-frame { position: absolute; left: -10000px; top: 0; width: 900px; height: 600px; border: 0; opacity: 0; pointer-events: none; }
        /* cover + totals pages */
        .wb-cover { border-color: #111827 !important; }
        .wb-cover h1 { font-size: 22pt; margin: 0 0 6pt; }
        .wb-sub { font-size: 11pt; color: #374151; margin-bottom: 14pt; }
        .wb-list { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
        .wb-list th, .wb-list td { border-bottom: 1px solid #d1d5db; padding: 4pt 6pt; text-align: left; vertical-align: top; }
        .wb-list th { background: #f3f4f6; font-size: 9.5pt; letter-spacing: .04em; text-transform: uppercase; }
        .wb-list .wb-num { text-align: right; }
        .wb-list tr.wb-miss td { color: #6b7280; }
        .wb-hint { margin-top: 14pt; font-size: 10pt; color: #4b5563; }
        .wb-totals { border-color: #16a34a !important; }
        .wb-week { border-color: #111827 !important; }
        .pp-bt-totals-panel { font-size: 11pt; }
        .pp-bt-totals-title { font-size: 15pt; font-weight: 800; margin-bottom: 10pt; }
        .pp-bt-totals-table { width: 100%; border-collapse: collapse; }
        .pp-bt-totals-table th, .pp-bt-totals-table td { border-bottom: 1px solid #d1d5db; padding: 4pt 8pt; text-align: left; }
        .pp-bt-totals-table th { background: #f3f4f6; font-size: 9.5pt; text-transform: uppercase; letter-spacing: .04em; }
        .pp-bt-totals-num { text-align: right; font-variant-numeric: tabular-nums; }
        .pp-bt-totals-cat-row td { background: #e5e7eb; font-weight: 800; font-size: 10pt; letter-spacing: .04em; text-transform: uppercase; }
        @media print {
            body { background: #fff; }
            .wb-bar, .wb-status, .wb-hidden-frame { display: none !important; }
            #wb-doc { padding: 0; }
            #wb-doc .bt-page { box-shadow: none; margin: 0; max-width: none; }
        }
    </style>
</head>
<body>
    <div class="wb-bar">
        <h1 id="wb-title">Batch tickets — week</h1>
        <a href="index.html">&larr; Weekly Schedule</a>
        <span class="wb-summary" id="wb-summary"></span>
        <button type="button" id="wb-print" disabled title="Print every ticket on this page; the Releasability Board's Batching Sheets is stamped for each casting">Print</button>
    </div>
    <div class="wb-status" id="wb-status">Loading…</div>
    <div id="wb-doc"></div>
    <script type="module" src="src/utils/auto-update.js?v=20261023-1"></script>
    <script type="module" src="src/pages/week-batch/week-batch-page.js?v=20261030-1"></script>
</body>
</html>
