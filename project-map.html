<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Map - Weekly Schedule</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8F%AD%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="src/styles/variables.css">
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/styles/buttons.css">
    <link rel="stylesheet" href="src/styles/finishing-map.css?v=20261026-4">
    <link rel="stylesheet" href="src/styles/project-map.css?v=20261026-2">
</head>
<body class="pm-body">
    <div id="fm-app" class="fm-app pm-app">
        <header class="fm-header">
            <div class="fm-header-left">
                <a href="project-portal.html" class="fm-nav-btn" title="Project Portal">&larr; Project Portal</a>
                <a href="index.html" class="fm-nav-btn" title="Weekly Schedule">Weekly Schedule</a>
                <a href="releasability.html" class="fm-nav-btn" title="Releasability Board">Releasability Board</a>
                <a href="finishing-map.html" class="fm-nav-btn fm-nav-sibling" title="Finishing Map">Finishing Map</a>
            </div>
            <h1 class="fm-title">Project Map</h1>
            <div class="pm-when">
                <div class="pm-view-stack">
                    <div class="pm-view" role="group" aria-label="View">
                        <button type="button" class="pm-view-btn pm-view-on" data-view="day">Day</button>
                        <button type="button" class="pm-view-btn" data-view="week">Week</button>
                        <button type="button" class="pm-view-btn" data-view="month4">4 weeks</button>
                        <button type="button" class="pm-view-btn" data-view="month">Month</button>
                    </div>
                    <button type="button" class="pm-view-btn pm-sunday" id="pm-sunday" title="Show a Sunday band in the week view" aria-pressed="false" hidden>Include Sundays</button>
                </div>
                <button type="button" class="fm-nav-btn pm-arrow" id="pm-prev" title="Earlier">&lsaquo;</button>
                <span class="pm-when-label" id="pm-when-label"></span>
                <button type="button" class="fm-nav-btn pm-arrow" id="pm-next" title="Later">&rsaquo;</button>
                <button type="button" class="fm-nav-btn" id="pm-today">Today</button>
            </div>
            <div class="fm-header-right">
                <span class="pm-sub" id="pm-sub"></span>
                <div class="pm-dept-dropdown" id="pm-dept-dropdown">
                    <button type="button" class="fm-nav-btn pm-dept-btn" id="pm-dept-btn" aria-haspopup="listbox"><span id="pm-dept-label">All departments</span> &#9662;</button>
                    <div class="pm-dept-panel">
                        <div class="pm-dept-actions"><button type="button" class="fm-mini-btn" id="pm-dept-all">Show all</button><button type="button" class="fm-mini-btn" id="pm-dept-none">Show none</button></div>
                        <ul class="pm-dept-list" id="pm-dept-list"></ul>
                    </div>
                </div>
                <input type="search" id="fm-search" class="fm-search" placeholder="Find a job or cast&hellip;" autocomplete="off">
                <button type="button" id="fm-shipped-btn" class="fm-nav-btn fm-btn-shipped" title="Castings shipped in the last 60 days">Shipped <span class="fm-area-count" id="fm-shipped-count">0</span></button>
                <button type="button" id="fm-refresh" class="fm-nav-btn" title="Reload the weekly">Refresh</button>
                <span id="fm-updated" class="fm-updated"></span>
            </div>
        </header>

        <div id="fm-notice" class="fm-notice" hidden></div>
        <div id="pm-hidden" class="pm-hidden" hidden></div>

        <main class="pm-main" id="pm-map" aria-label="Departments">
            <!-- department columns are rendered from project-map-config.js -->
        </main>
    </div>

    <div class="fm-modal" id="fm-modal" hidden>
        <div class="fm-modal-box" role="dialog" aria-modal="true" aria-labelledby="fm-modal-title">
            <div class="fm-modal-head">
                <span class="fm-modal-title" id="fm-modal-title"></span>
                <input type="search" id="fm-modal-search" class="fm-modal-search" placeholder="Filter&hellip;" autocomplete="off">
                <button type="button" class="fm-mini-btn fm-modal-close" id="fm-modal-close">Close</button>
            </div>
            <div class="fm-modal-body" id="fm-modal-body"></div>
        </div>
    </div>

    <script type="module" src="src/pages/project-map/project-map-page.js?v=20261026-1"></script>
    <script type="module" src="src/utils/auto-update.js?v=20261023-1"></script>
</body>
</html>
